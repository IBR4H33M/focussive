<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780">
  <defs>
    <linearGradient id="dfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1E30"/>
      <stop offset="100%" stop-color="#121422"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="360" height="760" rx="44" fill="#0D0F18" stroke="#3A4062" stroke-width="3"/>
  <rect x="22" y="22" width="336" height="736" rx="34" fill="url(#dfBg)"/>
  <rect x="140" y="32" width="100" height="24" rx="12" fill="#0A0B12"/>

  <text x="40" y="96" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">INTENTION ARCHITECTURE</text>
  <text x="40" y="126" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700">Your Driving Forces</text>
  <text x="40" y="150" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="13">What makes staying focused worth it today?</text>

  <!-- Card 1 (Selected) -->
  <rect x="36" y="180" width="308" height="88" rx="16" fill="#2F3456" stroke="#8BA794" stroke-width="2"/>
  <circle cx="64" cy="224" r="16" fill="#3A4062"/>
  <text x="64" y="229" text-anchor="middle" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="16">🎯</text>
  <text x="94" y="215" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600">Career &amp; Craft</text>
  <text x="94" y="236" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="12">Build a body of work I am proud of.</text>
  <circle cx="316" cy="224" r="10" fill="#8BA794"/>
  <path d="M312 224 L315 227 L321 221" fill="none" stroke="#121422" stroke-width="2"/>

  <!-- Card 2 -->
  <rect x="36" y="280" width="308" height="88" rx="16" fill="#232740" stroke="#3A4062" stroke-width="1"/>
  <circle cx="64" cy="324" r="16" fill="#1B1E30"/>
  <text x="64" y="329" text-anchor="middle" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="16">🧠</text>
  <text x="94" y="315" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600">Mental Clarity</text>
  <text x="94" y="336" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="12">Protect attention from fragmented noise.</text>

  <!-- Card 3 -->
  <rect x="36" y="380" width="308" height="88" rx="16" fill="#232740" stroke="#3A4062" stroke-width="1"/>
  <circle cx="64" cy="424" r="16" fill="#1B1E30"/>
  <text x="64" y="429" text-anchor="middle" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="16">⌛</text>
  <text x="94" y="415" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600">Reclaim Evening Time</text>
  <text x="94" y="436" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="12">Finish work during the day, rest without guilt.</text>

  <!-- Custom note -->
  <rect x="36" y="480" width="308" height="110" rx="16" fill="#1A1D2E" stroke="#3A4062" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="56" y="514" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700">PERSONAL MOTIVATION NOTE</text>
  <text x="56" y="542" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="13">"Ship the beta release before Friday."</text>
  <text x="56" y="566" fill="#5D6E75" font-family="-apple-system, system-ui, sans-serif" font-size="11">Surfaced on your lock screen during distraction.</text>

  <!-- Save button -->
  <rect x="36" y="620" width="308" height="52" rx="26" fill="#8BA794"/>
  <text x="190" y="652" text-anchor="middle" fill="#141726" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="700">Save &amp; Continue</text>

  <rect x="130" y="742" width="120" height="4" rx="2" fill="#BAC6B8" opacity="0.4"/>
