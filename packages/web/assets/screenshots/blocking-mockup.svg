<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780">
  <defs>
    <linearGradient id="blockBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1E30"/>
      <stop offset="100%" stop-color="#111320"/>
    </linearGradient>
    <filter id="shadowB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="360" height="760" rx="44" fill="#0D0F18" stroke="#3A4062" stroke-width="3" filter="url(#shadowB)"/>
  <rect x="22" y="22" width="336" height="736" rx="34" fill="url(#blockBg)"/>
  
  <rect x="140" y="32" width="100" height="24" rx="12" fill="#0A0B12"/>
  <text x="50" y="49" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600">09:42</text>

  <!-- Gentle Shield / Zen Icon -->
  <circle cx="190" cy="180" r="48" fill="#2F3456" stroke="#454B6E" stroke-width="2"/>
  <path d="M190 155 L215 170 L215 195 C215 210 190 220 190 220 C190 220 165 210 165 195 L165 170 Z" fill="#8BA794"/>

  <!-- Headline -->
  <text x="190" y="260" text-anchor="middle" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700">Pause for a moment</text>
  <text x="190" y="288" text-anchor="middle" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="14">Instagram is paused until 10:30 AM</text>

  <!-- Reflection Card -->
  <rect x="40" y="330" width="300" height="160" rx="20" fill="#232740" stroke="#3A4062" stroke-width="1"/>
  <text x="60" y="365" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">IS THIS A REFLEX?</text>
  <text x="60" y="398" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" width="260">"Don't trade what you want most for what you want now."</text>
  <text x="60" y="445" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="12">You have 28 mins left in your Deep Work block.</text>

  <!-- Action Buttons -->
  <rect x="40" y="525" width="300" height="52" rx="26" fill="#8BA794"/>
  <text x="190" y="557" text-anchor="middle" fill="#141726" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="700">Return to Focus</text>

  <rect x="40" y="590" width="300" height="50" rx="25" fill="none" stroke="#5D6E75" stroke-width="1.5"/>
  <text x="190" y="621" text-anchor="middle" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600">Emergency 1-Min Unblock</text>

  <rect x="130" y="742" width="120" height="4" rx="2" fill="#BAC6B8" opacity="0.4"/>
</svg>
