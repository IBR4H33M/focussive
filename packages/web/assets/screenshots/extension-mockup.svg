<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <linearGradient id="browserBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1E30"/>
      <stop offset="100%" stop-color="#121524"/>
    </linearGradient>
    <filter id="extShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Laptop / Browser Window Frame -->
  <rect x="20" y="20" width="680" height="440" rx="16" fill="#0E101A" stroke="#3A4062" stroke-width="2" filter="url(#extShadow)"/>
  
  <!-- Window Titlebar -->
  <rect x="20" y="20" width="680" height="42" rx="16" fill="#181B2B"/>
  <rect x="20" y="48" width="680" height="14" fill="#181B2B"/>
  
  <!-- Window Controls -->
  <circle cx="44" cy="41" r="6" fill="#8B1E1E"/>
  <circle cx="64" cy="41" r="6" fill="#F6C531"/>
  <circle cx="84" cy="41" r="6" fill="#587042"/>

  <!-- Chrome Address Bar -->
  <rect x="120" y="29" width="380" height="24" rx="12" fill="#252A42"/>
  <text x="140" y="45" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="11">x.com/home</text>

  <!-- Extension Icon in Toolbar -->
  <circle cx="525" cy="41" r="10" fill="#2F3456" stroke="#8BA794" stroke-width="1.5"/>
  <circle cx="525" cy="41" r="4" fill="#8BA794"/>

  <!-- Browser Content Area (Blocked Webpage) -->
  <rect x="22" y="62" width="676" height="396" fill="url(#browserBg)"/>

  <!-- Blocker Message in Browser -->
  <circle cx="260" cy="220" r="32" fill="#2F3456" stroke="#454B6E" stroke-width="1.5"/>
  <text x="260" y="226" text-anchor="middle" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="20">🔒</text>
  <text x="260" y="280" text-anchor="middle" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="700">Site Blocked by Focussive</text>
  <text x="260" y="306" text-anchor="middle" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="13">Synced with your active Android focus session</text>

  <!-- Chrome Extension Popup Overlay (Right side) -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="250" height="330" rx="14" fill="#20243B" stroke="#8BA794" stroke-width="1.5" filter="url(#extShadow)"/>
    
    <!-- Popup Header -->
    <rect x="0" y="0" width="250" height="50" rx="14" fill="#2F3456"/>
    <rect x="0" y="36" width="250" height="14" fill="#2F3456"/>
    <circle cx="24" cy="25" r="7" fill="#8BA794"/>
    <text x="40" y="30" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700">FOCUSSIVE Companion</text>

    <!-- Synced Device Indicator -->
    <rect x="16" y="65" width="218" height="48" rx="10" fill="#181B2D"/>
    <circle cx="34" cy="89" r="4" fill="#8BA794"/>
    <text x="48" y="85" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600">Pixel 8 Pro • Connected</text>
    <text x="48" y="101" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="10">Real-time sync active</text>

    <!-- Session details -->
    <text x="16" y="136" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CURRENT STATUS</text>
    <text x="16" y="160" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700">Deep Work Session</text>
    <text x="16" y="180" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="800">38:42 remaining</text>

    <!-- Blocked Domains Count -->
    <rect x="16" y="204" width="218" height="54" rx="8" fill="#2A2F4C"/>
    <text x="28" y="226" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="11">Protected Websites</text>
    <text x="28" y="246" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600">YouTube, Reddit, X, Twitter</text>

    <!-- Quick action -->
    <rect x="16" y="272" width="218" height="38" rx="19" fill="#8BA794"/>
    <text x="125" y="296" text-anchor="middle" fill="#121422" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700">Open Full Dashboard</text>
  </g>
</svg>
