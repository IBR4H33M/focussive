<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2238"/>
      <stop offset="100%" stop-color="#141726"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8BA794"/>
      <stop offset="100%" stop-color="#A9B494"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Phone Shell -->
  <rect x="10" y="10" width="360" height="760" rx="44" fill="#0D0F18" stroke="#3A4062" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Screen Inner -->
  <rect x="22" y="22" width="336" height="736" rx="34" fill="url(#bgGrad)"/>
  
  <!-- Dynamic Island / Speaker notch -->
  <rect x="140" y="32" width="100" height="24" rx="12" fill="#0A0B12"/>

  <!-- Status Bar Time -->
  <text x="50" y="49" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600">09:41</text>
  <circle cx="316" cy="45" r="4" fill="#8BA794"/>
  <rect x="324" y="41" width="16" height="8" rx="2" fill="none" stroke="#BAC6B8" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="98" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="12" letter-spacing="1.5" font-weight="700">ACTIVE SESSION</text>
  <text x="40" y="128" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700">Deep Work &amp; Focus</text>

  <!-- Big Timer Circle Container -->
  <circle cx="190" cy="280" r="110" fill="none" stroke="#2F3456" stroke-width="12"/>
  <circle cx="190" cy="280" r="110" fill="none" stroke="url(#arcGrad)" stroke-width="12" stroke-dasharray="690" stroke-dashoffset="190" stroke-linecap="round"/>

  <!-- Timer Inside -->
  <text x="190" y="270" text-anchor="middle" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">38:42</text>
  <text x="190" y="302" text-anchor="middle" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600">REMAINING</text>

  <!-- Driving Force Pill / Card -->
  <rect x="40" y="425" width="300" height="96" rx="20" fill="#2F3456" stroke="#454B6E" stroke-width="1"/>
  <text x="60" y="456" fill="#8BA794" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">YOUR DRIVING FORCE</text>
  <text x="60" y="482" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600">"Finish the prototype before lunch."</text>
  <text x="60" y="504" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="12">Protecting momentum from mindless scrolling</text>

  <!-- Cross-Device Sync Status -->
  <rect x="40" y="538" width="300" height="64" rx="16" fill="#232740" stroke="#3A4062" stroke-width="1"/>
  <circle cx="64" cy="570" r="6" fill="#8BA794"/>
  <text x="82" y="567" fill="#E9E4DC" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600">Chrome Extension Connected</text>
  <text x="82" y="586" fill="#BAC6B8" font-family="-apple-system, system-ui, sans-serif" font-size="11">Synced &amp; blocking 14 desktop sites</text>

  <!-- Button -->
  <rect x="40" y="630" width="300" height="52" rx="26" fill="#8BA794"/>
  <text x="190" y="662" text-anchor="middle" fill="#141726" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="700">Stay In Flow</text>

  <!-- Bottom Home Indicator -->
  <rect x="130" y="742" width="120" height="4" rx="2" fill="#BAC6B8" opacity="0.4"/>
</svg>
